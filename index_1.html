<style>
/*
  Design tokens.
  Colour carries meaning here, not just decoration:
    moss  -> poems
    rose  -> letters
    clay  -> shared accent (links, focus, buttons)
*/

:root {
  /* Base neutrals — warm paper, not pure white or black */
  --color-ink: #3a2b22;
  --color-ink-soft: #55452f;
  --color-paper: #f7f0e6;
  --color-paper-dim: #efe3d1;
  --color-muted: #7d6a56;

  /* Poems */
  --color-moss: #6e7d57;
  --color-moss-tint: #dee3ce;
  --color-moss-deep: #4c5a3a;

  /* Letters */
  --color-rose: #bd897f;
  --color-rose-tint: #ecdad4;
  --color-rose-deep: #97584d;

  /* Shared accent */
  --color-clay: #96633e;
  --color-clay-deep: #7a4f30;

  --color-border: #e3d5c1;

  /* Type */
  --font-display: 'Cormorant Garamond', 'Iowan Old Style', Georgia, serif;
  --font-body: 'Lora', Georgia, serif;

  /* Spacing scale */
  --space-3xs: 0.25rem;
  --space-2xs: 0.5rem;
  --space-xs: 0.75rem;
  --space-sm: 1.25rem;
  --space-md: 2rem;
  --space-lg: 3.5rem;
  --space-xl: 5.5rem;
  --space-2xl: 8rem;

  /* Layout */
  --measure-poem: 34rem;
  --measure-prose: 40rem;
  --width-wide: 68rem;

  /* Motion */
  --ease-quiet: cubic-bezier(0.22, 0.61, 0.36, 1);
  --duration-slow: 900ms;
  --duration-medium: 450ms;
  --duration-fast: 200ms;
}

/*
  Motion is spent in one place: the home page hero, on first load.
  Everywhere else is still, and interaction feedback (hover/focus)
  is instant or near-instant rather than decorative.
*/

@keyframes riseIn {
  from {
    opacity: 0;
    transform: translateY(14px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.hero-line {
  opacity: 0;
  animation: riseIn var(--duration-slow) var(--ease-quiet) forwards;
  animation-delay: 150ms;
}

.hero-sub {
  opacity: 0;
  animation: riseIn var(--duration-slow) var(--ease-quiet) forwards;
  animation-delay: 550ms;
}

.hero-links {
  opacity: 0;
  animation: riseIn var(--duration-slow) var(--ease-quiet) forwards;
  animation-delay: 800ms;
}

@media (prefers-reduced-motion: reduce) {
  .hero-line,
  .hero-sub,
  .hero-links {
    animation: none;
    opacity: 1;
    transform: none;
  }
  html {
    scroll-behavior: auto;
  }
}

/* ---------------------------------- */
/* Reset & base                       */
/* ---------------------------------- */

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background: var(--color-paper);
  color: var(--color-ink);
  font-family: var(--font-body);
  font-size: 1.0625rem;
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

img {
  max-width: 100%;
  display: block;
}

a {
  color: inherit;
  text-decoration: none;
}

h1,
h2,
h3,
h4 {
  font-family: var(--font-display);
  font-weight: 600;
  line-height: 1.2;
  margin: 0 0 var(--space-sm);
  color: var(--color-ink);
}

p {
  margin: 0 0 var(--space-sm);
}

:focus-visible {
  outline: 2px solid var(--color-clay);
  outline-offset: 3px;
}

::selection {
  background: var(--color-moss-tint);
}

/* ---------------------------------- */
/* Layout helpers                     */
/* ---------------------------------- */

.container {
  width: 100%;
  max-width: var(--width-wide);
  margin: 0 auto;
  padding: 0 var(--space-md);
}

.prose {
  width: 100%;
  max-width: var(--measure-prose);
  margin: 0 auto;
  padding: 0 var(--space-md);
}

.poem-measure {
  max-width: var(--measure-poem);
}

main {
  display: block;
  min-height: 60vh;
}

/* ---------------------------------- */
/* Header                             */
/* ---------------------------------- */

.site-header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: var(--space-sm);
  max-width: var(--width-wide);
  margin: 0 auto;
  padding: var(--space-md);
}

.wordmark {
  font-family: var(--font-display);
  font-size: 1.6rem;
  font-weight: 600;
  color: var(--color-ink);
  white-space: nowrap;
}

.wordmark span {
  display: block;
  font-family: var(--font-body);
  font-size: 0.8rem;
  font-style: italic;
  color: var(--color-muted);
  margin-top: 0.15rem;
}

.site-nav {
  display: flex;
  gap: var(--space-md);
  flex-wrap: wrap;
}

.site-nav a {
  position: relative;
  font-size: 0.95rem;
  color: var(--color-ink-soft);
  padding-bottom: 3px;
}

.site-nav a::after {
  content: '';
  position: absolute;
  left: 0;
  right: 100%;
  bottom: 0;
  height: 1px;
  background: var(--color-clay);
  transition: right var(--duration-medium) var(--ease-quiet);
}

.site-nav a:hover::after,
.site-nav a.active::after {
  right: 0;
}

.site-nav a.active {
  color: var(--color-ink);
}

/* ---------------------------------- */
/* Home hero                          */
/* ---------------------------------- */

.hero {
  max-width: var(--width-wide);
  margin: 0 auto;
  padding: var(--space-xl) var(--space-md) var(--space-lg);
}

.hero-line {
  font-family: var(--font-display);
  font-style: italic;
  font-weight: 500;
  font-size: clamp(1.9rem, 5vw, 3.25rem);
  line-height: 1.35;
  max-width: 26ch;
  color: var(--color-ink);
  padding-left: var(--space-md);
  border-left: 2px solid var(--color-clay);
  margin-bottom: var(--space-md);
}

.hero-sub {
  max-width: var(--measure-prose);
  color: var(--color-ink-soft);
  font-size: 1.1rem;
  margin-left: calc(var(--space-md) + 2px);
}

.hero-links {
  display: flex;
  gap: var(--space-md);
  margin-left: calc(var(--space-md) + 2px);
  margin-top: var(--space-sm);
  flex-wrap: wrap;
}

.hero-links a {
  font-size: 0.95rem;
  border-bottom: 1px solid var(--color-border);
  padding-bottom: 2px;
}

.hero-links a:hover {
  border-color: var(--color-clay);
  color: var(--color-clay-deep);
}

/* ---------------------------------- */
/* Section headings                   */
/* ---------------------------------- */

.section-heading {
  max-width: var(--width-wide);
  margin: 0 auto;
  padding: 0 var(--space-md);
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--space-sm);
  margin-top: var(--space-xl);
  margin-bottom: var(--space-sm);
  flex-wrap: wrap;
}

.section-heading h2 {
  font-size: 1.6rem;
  margin: 0;
}

.section-heading .section-note {
  color: var(--color-muted);
  font-size: 0.95rem;
  font-style: italic;
}

.page-title {
  max-width: var(--width-wide);
  margin: 0 auto;
  padding: var(--space-lg) var(--space-md) 0;
}

.page-title h1 {
  font-size: clamp(2rem, 4vw, 2.75rem);
}

.page-title .page-note {
  color: var(--color-muted);
  font-style: italic;
  font-size: 1.05rem;
  margin-top: -0.5rem;
}

/* ---------------------------------- */
/* Editorial list (poems / letters)   */
/* ---------------------------------- */

.post-list {
  max-width: var(--width-wide);
  margin: 0 auto;
  padding: 0 var(--space-md) var(--space-xl);
  list-style: none;
}

.post-row {
  border-bottom: 1px solid var(--color-border);
}

.post-row:first-child {
  border-top: 1px solid var(--color-border);
}

.post-row a {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--space-md);
  padding: var(--space-sm) 0;
}

.post-row .post-row-main {
  display: flex;
  align-items: baseline;
  gap: var(--space-xs);
  min-width: 0;
}

.post-row .kind-mark {
  flex: none;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--color-clay);
  transform: translateY(-3px);
}

.post-row.is-poem .kind-mark {
  background: var(--color-moss);
}

.post-row.is-letter .kind-mark {
  background: var(--color-rose);
}

.post-row h3 {
  font-size: 1.3rem;
  margin: 0;
  transition: color var(--duration-fast) var(--ease-quiet);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.post-row .excerpt {
  display: none;
  color: var(--color-muted);
  font-size: 0.95rem;
  font-style: italic;
  margin: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.post-row .post-date {
  flex: none;
  color: var(--color-muted);
  font-size: 0.9rem;
  white-space: nowrap;
}

.post-row.is-poem:hover h3 {
  color: var(--color-moss-deep);
}

.post-row.is-letter:hover h3 {
  color: var(--color-rose-deep);
}

.empty-note {
  max-width: var(--width-wide);
  margin: 0 auto;
  padding: var(--space-md);
  color: var(--color-muted);
  font-style: italic;
}

/* ---------------------------------- */
/* Individual post page                */
/* ---------------------------------- */

.post-header {
  max-width: var(--measure-prose);
  margin: 0 auto;
  padding: var(--space-lg) var(--space-md) 0;
}

.back-link {
  display: inline-block;
  font-size: 0.9rem;
  color: var(--color-muted);
  margin-bottom: var(--space-md);
  border-bottom: 1px solid transparent;
}

.back-link:hover {
  color: var(--color-clay-deep);
  border-color: var(--color-clay-deep);
}

.post-header h1 {
  font-size: clamp(1.9rem, 4vw, 2.6rem);
}

.post-date {
  color: var(--color-muted);
  font-size: 0.95rem;
  margin-bottom: 0;
}

.post-body {
  max-width: var(--measure-prose);
  margin: 0 auto;
  padding: var(--space-md) var(--space-md) var(--space-2xl);
  font-size: 1.15rem;
}

.post-body.type-poem {
  max-width: var(--measure-poem);
}

.post-body.type-poem p.stanza {
  margin-bottom: var(--space-md);
}

.post-body.type-letter p {
  margin-bottom: var(--space-sm);
}

.post-body em {
  font-style: italic;
}

.post-body strong {
  font-weight: 600;
}

.post-footer-nav {
  max-width: var(--measure-prose);
  margin: 0 auto;
  padding: 0 var(--space-md) var(--space-2xl);
}

/* ---------------------------------- */
/* About page                          */
/* ---------------------------------- */

.about-layout {
  max-width: var(--width-wide);
  margin: 0 auto;
  padding: var(--space-lg) var(--space-md) var(--space-2xl);
  display: grid;
  grid-template-columns: 280px 1fr;
  gap: var(--space-xl);
  align-items: start;
}

.about-photo {
  width: 100%;
  aspect-ratio: 3 / 4;
  object-fit: cover;
  border: 1px solid var(--color-border);
}

.about-text {
  max-width: var(--measure-prose);
  font-size: 1.1rem;
}

.about-text h1 {
  margin-bottom: var(--space-md);
}

/* ---------------------------------- */
/* Footer                              */
/* ---------------------------------- */

.site-footer {
  max-width: var(--width-wide);
  margin: 0 auto;
  padding: var(--space-lg) var(--space-md) var(--space-md);
  border-top: 1px solid var(--color-border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: var(--space-sm);
  color: var(--color-muted);
  font-size: 0.9rem;
}

.site-footer nav {
  display: flex;
  gap: var(--space-sm);
}

.site-footer a:hover {
  color: var(--color-clay-deep);
}

/* ---------------------------------- */
/* Responsive                          */
/* ---------------------------------- */

@media (max-width: 640px) {
  .about-layout {
    grid-template-columns: 1fr;
  }

  .about-photo {
    max-width: 220px;
    aspect-ratio: 3 / 4;
  }

  .post-row .excerpt {
    display: none;
  }

  .post-row a {
    flex-direction: column;
    align-items: flex-start;
    gap: var(--space-3xs);
  }

  .post-row h3 {
    white-space: normal;
    overflow: visible;
    text-overflow: unset;
  }

  .hero-line {
    padding-left: var(--space-sm);
  }

  .hero-sub,
  .hero-links {
    margin-left: calc(var(--space-sm) + 2px);
  }
}

@media (min-width: 780px) {
  .post-row .excerpt {
    display: block;
    max-width: 34ch;
  }
}

/* ============================================================
   Small content helpers
   ============================================================ */

function escapeHtml(str) {
  return str
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

function applyEmphasis(escapedLine) {
  return escapedLine
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>');
}

// Poems: every line break matters. Blank lines separate stanzas.
function renderPoemBody(content) {
  return content
    .split(/\n\s*\n/)
    .map((stanza) => {
      const lines = stanza.split('\n').map((line) => applyEmphasis(escapeHtml(line.trim())));
      return `<p class="stanza">${lines.join('<br>')}</p>`;
    })
    .join('');
}

// Letters: ordinary prose. Blank lines start a new paragraph.
function renderLetterBody(content) {
  return content
    .split(/\n\s*\n/)
    .map((para) => {
      const joined = para.split('\n').map((line) => line.trim()).join(' ');
      return `<p>${applyEmphasis(escapeHtml(joined))}</p>`;
    })
    .join('');
}

function formatDate(dateStr) {
  const d = new Date(`${dateStr}T00:00:00`);
  if (Number.isNaN(d.getTime())) return dateStr;
  return d.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
}

function findPost(collection, slug) {
  const list = collection === 'poems' ? poems : letters;
  return list.find((p) => p.slug === slug);
}

function postHref(post) {
  return post.collection === 'poems' ? `#/poem/${post.slug}` : `#/letter/${post.slug}`;
}

function postRowHtml(post) {
  const kindClass = post.collection === 'poems' ? 'is-poem' : 'is-letter';
  return `
    <li class="post-row ${kindClass}">
      <a href="${postHref(post)}">
        <span class="post-row-main">
          <span class="kind-mark" aria-hidden="true"></span>
          <h3>${escapeHtml(post.title)}</h3>
        </span>
        <span class="excerpt">${escapeHtml(post.excerpt)}</span>
        <span class="post-date">${formatDate(post.date)}</span>
      </a>
    </li>
  `;
}

/* ============================================================
   Page renderers — each returns an HTML string for #app
   ============================================================ */

function renderHome() {
  const recent = [...poems, ...letters].sort((a, b) => (a.date < b.date ? 1 : -1)).slice(0, 5);
  const rows = recent.length
    ? recent.map(postRowHtml).join('')
    : '<p class="empty-note">Nothing published yet.</p>';

  return `
    <section class="hero">
      <p class="hero-line">and let the quiet<br>say what it needs to say.</p>
      <p class="hero-sub">Poems, letters, and other unfinished thoughts, kept here slowly.</p>
      <p class="hero-links">
        <a href="#/poems">Read the poems</a>
        <a href="#/letters">Read the letters</a>
      </p>
    </section>
    <div class="section-heading"><h2>Recent writing</h2></div>
    <ul class="post-list">${rows}</ul>
  `;
}

function renderListing(collection) {
  const items = collection === 'poems' ? poems : letters;
  const sorted = [...items].sort((a, b) => (a.date < b.date ? 1 : -1));
  const title = collection === 'poems' ? 'Poems' : 'Letters';
  const note =
    collection === 'poems'
      ? 'Verse, mostly written in the in-between hours.'
      : 'Notes written to someone in particular, and sometimes to no one.';
  const emptyMsg =
    collection === 'poems'
      ? 'No poems published yet \u2014 add one to the poems array.'
      : 'No letters published yet \u2014 add one to the letters array.';
  const rows = sorted.length ? sorted.map(postRowHtml).join('') : `<p class="empty-note">${emptyMsg}</p>`;

  return `
    <div class="page-title"><h1>${title}</h1><p class="page-note">${note}</p></div>
    <ul class="post-list">${rows}</ul>
  `;
}

function renderAbout() {
  return `
    <div class="about-layout">
      <img class="about-photo" src="${PROFILE_PHOTO}" alt="A photo of Dave" width="675" height="900">
      <div class="about-text">
        <h1>About</h1>
        <p>I'm Dave \u2014 I write in the hour before the rest of the day gets loud. Poems,
        mostly, though sometimes a letter arrives that doesn't quite fit anywhere else.</p>
        <p>I started keeping this page because I wanted a quiet place to put things
        down \u2014 not exactly to publish, just to keep. If a line here means something
        to you, I'm glad it found you.</p>
        <p>Thank you for reading slowly.</p>
      </div>
    </div>
  `;
}

function renderPost(collection, slug) {
  const backHref = collection === 'poems' ? '#/poems' : '#/letters';
  const backLabel = collection === 'poems' ? 'Poems' : 'Letters';
  const backLink = `<a class="back-link" href="${backHref}">&larr; Back to ${backLabel}</a>`;
  const post = findPost(collection, slug);

  if (!post) {
    document.title = 'Not found \u2014 Dave';
    return `<div class="post-header">${backLink}<p class="empty-note">This piece couldn\u2019t be found.</p></div>`;
  }

  document.title = `${post.title} \u2014 Dave`;
  const typeClass = collection === 'poems' ? 'type-poem' : 'type-letter';
  const bodyHtml = collection === 'poems' ? renderPoemBody(post.body) : renderLetterBody(post.body);

  return `
    <div class="post-header">
      ${backLink}
      <h1>${escapeHtml(post.title)}</h1>
      <p class="post-date">${formatDate(post.date)}</p>
    </div>
    <div class="post-body ${typeClass}">${bodyHtml}</div>
    <div class="post-footer-nav">${backLink}</div>
  `;
}

function renderNotFound() {
  return '<div class="post-header"><p class="empty-note">Page not found.</p></div>';
}

/* ============================================================
   Router — hash-based, so this works from a plain double-clicked
   file with no server. #/, #/poems, #/letters, #/about,
   #/poem/<slug>, #/letter/<slug>
   ============================================================ */

function router() {
  const hash = location.hash.replace(/^#\/?/, '');
  const parts = hash.split('/').filter(Boolean);
  const app = document.getElementById('app');
  let activeRoute = 'home';

  if (parts.length === 0) {
    app.innerHTML = renderHome();
    document.title = 'Dave \u2014 Poems & Letters';
    activeRoute = 'home';
  } else if (parts[0] === 'poems') {
    app.innerHTML = renderListing('poems');
    document.title = 'Poems \u2014 Dave';
    activeRoute = 'poems';
  } else if (parts[0] === 'letters') {
    app.innerHTML = renderListing('letters');
    document.title = 'Letters \u2014 Dave';
    activeRoute = 'letters';
  } else if (parts[0] === 'about') {
    app.innerHTML = renderAbout();
    document.title = 'About \u2014 Dave';
    activeRoute = 'about';
  } else if (parts[0] === 'poem' && parts[1]) {
    app.innerHTML = renderPost('poems', decodeURIComponent(parts[1]));
    activeRoute = 'poems';
  } else if (parts[0] === 'letter' && parts[1]) {
    app.innerHTML = renderPost('letters', decodeURIComponent(parts[1]));
    activeRoute = 'letters';
  } else {
    app.innerHTML = renderNotFound();
    activeRoute = '';
  }

  document.querySelectorAll('.site-nav a[data-route]').forEach((a) => {
    a.classList.toggle('active', a.dataset.route === activeRoute);
  });
  window.scrollTo(0, 0);
}

window.addEventListener('hashchange', router);
window.addEventListener('DOMContentLoaded', () => {
  const yearEl = document.getElementById('year');
  if (yearEl) yearEl.textContent = new Date().getFullYear();
  router();
});

</script>
